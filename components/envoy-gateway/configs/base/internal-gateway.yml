apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-cluster-gateway
  namespace: gateway-system
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: internal-envoy-proxy
      namespace: gateway-system
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.ilysium.io"
